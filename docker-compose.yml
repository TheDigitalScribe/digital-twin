# ---------------------------------------------------------------------------
# Digital Twin — local deployment
# Usage: docker compose up --build
# Secrets come from a local .env file (never committed).
#
# Production notes:
#   * Always put a reverse proxy (nginx/Caddy/Traefik) in front with TLS;
#     only the proxy's IP should be in TRUSTED_PROXIES.
#   * The data/ volume persists captured leads — never restart without it
#     if you care about that data.
# ---------------------------------------------------------------------------

services:
  digital-twin:
    build:
      context: .
      dockerfile: Dockerfile
    image: digital-twin:latest
    container_name: digital-twin
    ports:
      - '127.0.0.1:7860:7860'
    env_file:
      - .env
    # Persistent lead-capture DB (matching the container path from the
    # Dockerfile). Bind-mount is simplest for single-host deployments.
    volumes:
      - ./data:/data
    environment:
      # Make the app write the leads DB inside the mounted volume.
      # Override via .env if you prefer a different path.
      LEADS_DB_PATH: ${LEADS_DB_PATH:-/data/leads.db}
    restart: unless-stopped
    # Security hardening: no capabilities, read-only root fs (only the data
    # dir is writable), and pids/mem limits to contain runaway behavior.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 512
    mem_limit: 512m
    # Healthcheck mirrors the Dockerfile (compose-level so `docker compose ps`
    # reports health even without the daemon's HEALTHCHECK wiring).
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/healthz', timeout=2).read()",
        ]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
