# ---------------------------------------------------------------------------
# Digital Twin — local deployment
# Usage: docker compose up --build
# Secrets come from a local .env file (never committed).
#
# Production notes:
#   * Always put a reverse proxy (nginx/Caddy/Traefik) in front with TLS;
#     only the proxy's IP should be in TRUSTED_PROXIES.
#   * Render's free tier is ephemeral, so no persistent volume is needed.
# ---------------------------------------------------------------------------

services:
  digital-twin:
    build:
      context: .
      dockerfile: Dockerfile
    image: digital-twin:latest
    container_name: digital-twin
    ports:
      - '127.0.0.1:7860:7860'
    env_file:
      - .env
    restart: unless-stopped
    # Security hardening: no capabilities, read-only root fs, and pids/mem
    # limits to contain runaway behavior.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      # Writable location for the RAG index built by docker-entrypoint.sh at
      # container start. Ephemeral (in-memory) by design — see docs/deployment.md §7.
      - /app/data
    pids_limit: 512
    mem_limit: 512m
    # Healthcheck mirrors the Dockerfile (compose-level so `docker compose ps`
    # reports health even without the daemon's HEALTHCHECK wiring).
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/healthz', timeout=2).read()",
        ]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
